# Builds the v1 release artefacts (PRD §7 «Distribución y actualizaciones»):
#   Linux   plexustyping_<version>_amd64.deb            (Tauri bundler)
#           plexustyping-<version>-linux-x86_64.tar.gz  (scripts/package-linux-tarball.sh)
#   Windows PlexusTyping_<version>_x64-setup.exe        (Tauri bundler, NSIS, unsigned)
# plus one SHA256SUMS over all of them. On a v* tag the files are attached to
# a DRAFT GitHub release; publishing it stays a human action.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "22"
  PNPM_VERSION: "10.33.0"

jobs:
  linux:
    name: Linux (.deb + .tar.gz)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies (WebKitGTK 4.1, GTK 3, ALSA, D-Bus)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config file patchelf \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev libssl-dev \
            libasound2-dev libdbus-1-dev

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch, 2026-11
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Read the version and check it matches the tag
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [[ "$REF_TYPE" == tag && "$REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $REF_NAME does not match version $version in src-tauri/tauri.conf.json"
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend checks and tests
        run: |
          pnpm check
          pnpm test

      - name: Rust tests
        run: cargo test --workspace --locked

      - name: Tarball script test
        run: scripts/test-package-linux-tarball.sh

      - name: Build the .deb
        run: pnpm tauri build --bundles deb

      - name: Check the .deb dependencies
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Tauri names the file after productName (PlexusTyping_<v>_amd64.deb).
          deb="target/release/bundle/deb/PlexusTyping_${VERSION}_amd64.deb"
          test -f "$deb" || { echo "::error::missing $deb"; ls target/release/bundle/deb; exit 1; }
          depends=$(dpkg-deb -f "$deb" Depends)
          echo "Depends: $depends"
          for pkg in libwebkit2gtk-4.1-0 libgtk-3-0; do
            grep -q "$pkg" <<<"$depends" || { echo "::error::$deb does not depend on $pkg"; exit 1; }
          done

      - name: Package the .tar.gz
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p artifacts
          # Published under the PRD name; the Debian package itself is plexus-typing.
          cp "target/release/bundle/deb/PlexusTyping_${VERSION}_amd64.deb" "artifacts/plexustyping_${VERSION}_amd64.deb"
          scripts/package-linux-tarball.sh target/release/plexustyping "$VERSION" artifacts
          ls -l artifacts

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: artifacts/*
          if-no-files-found: error

  windows:
    name: Windows (NSIS .exe)
    runs-on: windows-latest
    env:
      # aws-lc-sys (rustls backend) uses its prebuilt NASM objects instead of
      # requiring NASM on the runner.
      AWS_LC_SYS_PREBUILT_NASM: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch, 2026-11
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the NSIS installer
        run: pnpm tauri build --bundles nsis

      - name: Collect the installer
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mkdir -p artifacts
          cp "target/release/bundle/nsis/PlexusTyping_${version}_x64-setup.exe" artifacts/
          ls -l artifacts

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: artifacts/*
          if-no-files-found: error

  release:
    name: SHA256SUMS and draft release
    needs: [linux, windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          merge-multiple: true

      - name: Write SHA256SUMS
        working-directory: release
        run: |
          shopt -s nullglob
          files=(*.deb *.tar.gz *.exe)
          if ((${#files[@]} != 3)); then
            echo "::error::Expected one .deb, one .tar.gz and one .exe, got: ${files[*]}"
            exit 1
          fi
          sha256sum "${files[@]}" >SHA256SUMS
          cat SHA256SUMS
          sha256sum -c SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SHA256SUMS
          path: release/SHA256SUMS
          if-no-files-found: error

      - name: Create or update the draft release
        if: github.ref_type == 'tag'
        working-directory: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          files=(*.deb *.tar.gz *.exe SHA256SUMS)
          if is_draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$is_draft" != true ]]; then
              echo "::error::Release $TAG is already published; not changing it."
              exit 1
            fi
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" \
              --draft --verify-tag \
              --title "PlexusTyping ${TAG#v}" \
              --notes "PlexusTyping ${TAG#v}. Comprueba las descargas con: sha256sum -c SHA256SUMS. El instalador de Windows no está firmado: SmartScreen muestra un aviso («Más información» → «Ejecutar de todas formas»)."
          fi
