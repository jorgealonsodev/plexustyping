[workspace]
resolver = "3"
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jorgealonsodev/plexustyping"
rust-version = "1.88"
publish = false

[workspace.dependencies]
plexustyping-core = { path = "crates/plexustyping-core" }
plexustyping-layouts = { path = "crates/plexustyping-layouts" }
plexustyping-corpus = { path = "crates/plexustyping-corpus" }
plexustyping-store = { path = "crates/plexustyping-store" }
plexustyping-audio = { path = "crates/plexustyping-audio" }
plexustyping-ai = { path = "crates/plexustyping-ai" }
plexustyping-highlight = { path = "crates/plexustyping-highlight" }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"
unicode-normalization = "0.1"
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
cpal = "0.18"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1", features = ["rt", "macros", "time", "net", "io-util", "sync"] }
async-trait = "0.1"
keyring = "4.2"
# Sign in with ChatGPT: RS256 ID-token checks on the aws-lc-rs backend that rustls already uses.
jsonwebtoken = { version = "12", default-features = false, features = ["aws_lc_rs"] }
aws-lc-rs = "1.15"
base64 = "0.23"
url = "2.5"
keyring-core = "1.0"
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "regex-fancy", "parsing"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
