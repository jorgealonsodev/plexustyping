[package]
name = "plexustyping-ai"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
aws-lc-rs.workspace = true
base64.workspace = true
jsonwebtoken.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
unicode-normalization.workspace = true
url.workspace = true

[features]
# Exposes `Endpoints::loopback` (plain-http mock servers). Enable it only in
# `[dev-dependencies]`: production builds must not be able to name it.
test-endpoints = []

[dev-dependencies]
# The integration tests in `tests/` use `Endpoints::loopback`.
plexustyping-ai = { path = ".", features = ["test-endpoints"] }
