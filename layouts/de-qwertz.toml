# German (Germany) QWERTZ keyboard layout: what Windows and XKB `de(basic)` agree on.
# Keys are `KeyboardEvent.code` values; layers are `normal`, `shift` and `altgr`.
name = "Deutsch (Deutschland)"
dead_keys = ["^", "´", "`"]

# Number row
# ^ is a dead key.
[keys.Backquote]
normal = "^"
shift = "°"

[keys.Digit1]
normal = "1"
shift = "!"

[keys.Digit2]
normal = "2"
shift = "\""
altgr = "²"

[keys.Digit3]
normal = "3"
shift = "§"
altgr = "³"

[keys.Digit4]
normal = "4"
shift = "$"

[keys.Digit5]
normal = "5"
shift = "%"

[keys.Digit6]
normal = "6"
shift = "&"

[keys.Digit7]
normal = "7"
shift = "/"
altgr = "{"

[keys.Digit8]
normal = "8"
shift = "("
altgr = "["

[keys.Digit9]
normal = "9"
shift = ")"
altgr = "]"

[keys.Digit0]
normal = "0"
shift = "="
altgr = "}"

[keys.Minus]
normal = "ß"
shift = "?"
altgr = "\\"

# ´ and ` are dead keys.
[keys.Equal]
normal = "´"
shift = "`"

# Top row
[keys.KeyQ]
normal = "q"
shift = "Q"
altgr = "@"

[keys.KeyW]
normal = "w"
shift = "W"

[keys.KeyE]
normal = "e"
shift = "E"
altgr = "€"

[keys.KeyR]
normal = "r"
shift = "R"

[keys.KeyT]
normal = "t"
shift = "T"

[keys.KeyY]
normal = "z"
shift = "Z"

[keys.KeyU]
normal = "u"
shift = "U"

[keys.KeyI]
normal = "i"
shift = "I"

[keys.KeyO]
normal = "o"
shift = "O"

[keys.KeyP]
normal = "p"
shift = "P"

[keys.BracketLeft]
normal = "ü"
shift = "Ü"

# AltGr ~ is a plain character.
[keys.BracketRight]
normal = "+"
shift = "*"
altgr = "~"

# Home row
[keys.KeyA]
normal = "a"
shift = "A"

[keys.KeyS]
normal = "s"
shift = "S"

[keys.KeyD]
normal = "d"
shift = "D"

[keys.KeyF]
normal = "f"
shift = "F"

[keys.KeyG]
normal = "g"
shift = "G"

[keys.KeyH]
normal = "h"
shift = "H"

[keys.KeyJ]
normal = "j"
shift = "J"

[keys.KeyK]
normal = "k"
shift = "K"

[keys.KeyL]
normal = "l"
shift = "L"

[keys.Semicolon]
normal = "ö"
shift = "Ö"

[keys.Quote]
normal = "ä"
shift = "Ä"

[keys.Backslash]
normal = "#"
shift = "'"

# Bottom row
[keys.IntlBackslash]
normal = "<"
shift = ">"
altgr = "|"

[keys.KeyZ]
normal = "y"
shift = "Y"

[keys.KeyX]
normal = "x"
shift = "X"

[keys.KeyC]
normal = "c"
shift = "C"

[keys.KeyV]
normal = "v"
shift = "V"

[keys.KeyB]
normal = "b"
shift = "B"

[keys.KeyN]
normal = "n"
shift = "N"

[keys.KeyM]
normal = "m"
shift = "M"
altgr = "µ"

[keys.Comma]
normal = ","
shift = ";"

[keys.Period]
normal = "."
shift = ":"

[keys.Slash]
normal = "-"
shift = "_"

[keys.Space]
normal = " "
