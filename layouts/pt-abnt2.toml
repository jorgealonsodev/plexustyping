# Portuguese (Brazil) ABNT2 keyboard layout: what Windows and XKB `br(abnt2)` agree on.
# Keys are `KeyboardEvent.code` values; layers are `normal`, `shift` and `altgr`.
name = "Português (Brasil)"
dead_keys = ["´", "`", "^", "~", "¨"]

# Number row
[keys.Backquote]
normal = "'"
shift = "\""

[keys.Digit1]
normal = "1"
shift = "!"
altgr = "¹"

[keys.Digit2]
normal = "2"
shift = "@"
altgr = "²"

[keys.Digit3]
normal = "3"
shift = "#"
altgr = "³"

[keys.Digit4]
normal = "4"
shift = "$"
altgr = "£"

[keys.Digit5]
normal = "5"
shift = "%"
altgr = "¢"

# ¨ is a dead key.
[keys.Digit6]
normal = "6"
shift = "¨"
altgr = "¬"

[keys.Digit7]
normal = "7"
shift = "&"

[keys.Digit8]
normal = "8"
shift = "*"

[keys.Digit9]
normal = "9"
shift = "("

[keys.Digit0]
normal = "0"
shift = ")"

[keys.Minus]
normal = "-"
shift = "_"

[keys.Equal]
normal = "="
shift = "+"
altgr = "§"

# Top row
[keys.KeyQ]
normal = "q"
shift = "Q"
altgr = "/"

[keys.KeyW]
normal = "w"
shift = "W"
altgr = "?"

[keys.KeyE]
normal = "e"
shift = "E"
altgr = "°"

[keys.KeyR]
normal = "r"
shift = "R"

[keys.KeyT]
normal = "t"
shift = "T"

[keys.KeyY]
normal = "y"
shift = "Y"

[keys.KeyU]
normal = "u"
shift = "U"

[keys.KeyI]
normal = "i"
shift = "I"

[keys.KeyO]
normal = "o"
shift = "O"

[keys.KeyP]
normal = "p"
shift = "P"

# ´ and ` are dead keys.
[keys.BracketLeft]
normal = "´"
shift = "`"

[keys.BracketRight]
normal = "["
shift = "{"
altgr = "ª"

# Home row
[keys.KeyA]
normal = "a"
shift = "A"

[keys.KeyS]
normal = "s"
shift = "S"

[keys.KeyD]
normal = "d"
shift = "D"

[keys.KeyF]
normal = "f"
shift = "F"

[keys.KeyG]
normal = "g"
shift = "G"

[keys.KeyH]
normal = "h"
shift = "H"

[keys.KeyJ]
normal = "j"
shift = "J"

[keys.KeyK]
normal = "k"
shift = "K"

[keys.KeyL]
normal = "l"
shift = "L"

[keys.Semicolon]
normal = "ç"
shift = "Ç"

# ~ and ^ are dead keys.
[keys.Quote]
normal = "~"
shift = "^"

[keys.Backslash]
normal = "]"
shift = "}"
altgr = "º"

# Bottom row
[keys.IntlBackslash]
normal = "\\"
shift = "|"

[keys.KeyZ]
normal = "z"
shift = "Z"

[keys.KeyX]
normal = "x"
shift = "X"

[keys.KeyC]
normal = "c"
shift = "C"

[keys.KeyV]
normal = "v"
shift = "V"

[keys.KeyB]
normal = "b"
shift = "B"

[keys.KeyN]
normal = "n"
shift = "N"

[keys.KeyM]
normal = "m"
shift = "M"

[keys.Comma]
normal = ","
shift = "<"

[keys.Period]
normal = "."
shift = ">"

[keys.Slash]
normal = ";"
shift = ":"

# The extra ABNT2 key between Slash and the right Shift.
[keys.IntlRo]
normal = "/"
shift = "?"
altgr = "°"

[keys.Space]
normal = " "
